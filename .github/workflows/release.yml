name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test Veyra.slnx -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${env:GITHUB_REF_NAME}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          body_path: CHANGELOG.md
